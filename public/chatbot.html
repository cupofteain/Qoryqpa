<!DOCTYPE html>
<html lang="kk">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Qoryqpa Чат-бот</title>
        <link href="styles.css" rel="stylesheet" />
        <style>
            .language-selector {
                margin-left: 1rem;
                padding: 0.4rem 0.6rem;
                border-radius: 8px;
                border: none;
                font-weight: 500;
                background-color: #fff;
                color: #333;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .language-selector:hover {
                background-color: #e0dfd4;
            }

            .chat-box {
                max-height: 400px;
                overflow-y: auto;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 8px;
                margin-bottom: 10px;
            }

            .user-message {
                background-color: #d1e7ff;
                padding: 6px 10px;
                margin: 4px 0;
                border-radius: 6px;
                text-align: right;
            }

            .bot-message {
                background-color: #f1f1f1;
                padding: 6px 10px;
                margin: 4px 0;
                border-radius: 6px;
                text-align: left;
            }
        </style>
    </head>

    <body>

        <nav class="navbar">
            <div class="logo">Qoryqpa</div>
            <ul class="nav-links">
                <li><a href="index.html">Басты бет</a></li>
                <li><a href="about.html">Біз туралы</a></li>
                <li><a href="chatbot.html" class="active">Чат-бот</a></li>
                <li><a href="constitution.html">Конституция</a></li>
            </ul>
            <select id="languageSelector" class="language-selector">
                <option value="kz">Қазақша</option>
                <option value="ru">Русский</option>
                <option value="en">English</option>
            </select>
        </nav>

        <main class="container chatbot-container">
            <h1>Qoryqpa Чат-бот</h1>
            <p class="chat-intro">Бұл бөлімде сіз құқықтық немесе ақпараттық көмек ала аласыз.</p>

            <div class="chat-box" id="messages"></div>

            <div class="chat-input">
                <input type="text" id="userInput" placeholder="Сұрағыңызды жазыңыз..." />
                <button id="sendBtn">Жіберу</button>
            </div>
        </main>

        <footer class="footer">
            <p>© 2025 Qoryqpa. Барлық құқықтар қорғалған.</p>
        </footer>

        <script>
            const messagesContainer = document.getElementById("messages");
            const userInput = document.getElementById("userInput");
            const sendBtn = document.getElementById("sendBtn");
            const languageSelector = document.getElementById("languageSelector");

            let faq = [];

            // Загружаем справочник
            async function loadFaq() {
                try {
                    const res = await fetch("/army_faq.json");
                    faq = await res.json();
                } catch (err) {
                    console.error("Не удалось загрузить справочник:", err);
                }
            }

            loadFaq();

            function addMessage(text, type) {
                const messageDiv = document.createElement("div");
                messageDiv.classList.add(type === "user" ? "user-message" : "bot-message");
                messageDiv.textContent = text;
                messagesContainer.appendChild(messageDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function detectLanguage(text) {
                const englishRegex = /[a-zA-Z]/;
                const kazakhRegex = /[әіңғүұөқһіӘІҢҒҮҰӨҚҺ]/i; // уникальные казахские буквы
                const cyrillicRegex = /[а-яА-ЯёЁ]/; // русские буквы

                if (englishRegex.test(text) && !cyrillicRegex.test(text)) return "en";
                if (kazakhRegex.test(text)) return "kz";
                if (cyrillicRegex.test(text)) return "ru";

                return null;
            }

            function getBotReply(message, lang) {
                const text = message.toLowerCase().trim();

                // точное совпадение
                for (const item of faq) {
                    if (item.question[lang] && item.question[lang].toLowerCase().trim() === text) {
                        return item.answer[lang] || item.answer["ru"];
                    }
                }

                // поиск по ключевым словам
                for (const item of faq) {
                    if (item.keywords && item.keywords.some(k => text.includes(k.toLowerCase()))) {
                        return item.answer[lang] || item.answer["ru"];
                    }
                }

                // fallback
                return lang === "ru" ?
                "Извините, я пока не знаю, как ответить на это." :
                    lang === "kz" ?
                "Кешіріңіз, мен әлі қалай жауап беруді білмеймін." :
                    "Sorry, I don't know how to respond to that yet.";
            }


            function sendMessage() {
                const userText = userInput.value.trim();
                if (!userText) return;

                addMessage(userText, "user");

                const detectedLang = detectLanguage(userText);
                const language = detectedLang || languageSelector.value;

                const reply = getBotReply(userText, language);

                addMessage(reply, "bot");

                userInput.value = "";
            }

            sendBtn.addEventListener("click", sendMessage);
            userInput.addEventListener("keypress", e => {
                if (e.key === "Enter") sendMessage();
            });
        </script>

    </body>

</html>
